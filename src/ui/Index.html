<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; overflow: hidden; }
    </style>
  </head>
  <body class="bg-[#f8f9fa] dark:bg-[#131314] font-sans antialiased h-screen flex flex-col items-center justify-center p-4 relative select-none transition-colors duration-300">
 
    <div class="bg-white dark:bg-[#1e1f20] p-8 rounded-[24px] shadow-xs border border-slate-200/70 dark:border-slate-800/60 text-center w-full max-w-sm relative z-10 transition-all duration-300">
      
      <div class="mx-auto w-14 h-14 bg-[#f0f4f9] dark:bg-[#2b2c2d] text-slate-700 dark:text-slate-200 rounded-2xl flex items-center justify-center mb-5 text-xl">
        📥
      </div>
      
      <h1 class="text-base md:text-lg font-semibold text-slate-900 dark:text-slate-100 tracking-tight mb-1 transition-colors">Asset AI Scanner</h1>
      <!-- ★ text-[11px] ➔ text-xs に底上げ -->
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-8 font-medium">INBOX一括自動解析・台帳登録</p>
 
      <div class="mb-8">
        <!-- ボタンのテキストは text-sm に拡大し、タップしやすく -->
        <button id="btn" onclick="runScan()" disabled
          class="w-full py-4 px-8 bg-slate-900 dark:bg-white hover:bg-slate-800 dark:hover:bg-slate-100 active:scale-[0.96] text-white dark:text-slate-900 text-sm font-bold tracking-widest uppercase rounded-full shadow-sm transition-all duration-300 disabled:bg-slate-100 dark:disabled:bg-slate-800 disabled:text-slate-300 dark:disabled:text-slate-600 disabled:shadow-none border border-transparent flex items-center justify-center gap-3 cursor-pointer disabled:cursor-not-allowed">
          <span id="btn-text">Scan & Execute</span>
        </button>
      </div>

      <div class="mb-4 text-left px-1">
        <!-- ★ text-[10px] ➔ text-xs に底上げ -->
        <label for="model-select" class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 ml-0.5">🤖 設定: 使用AIモデル</label>
        <div class="relative">
          <select id="model-select" disabled
            class="w-full p-3.5 bg-[#f0f4f9] dark:bg-[#0f0f10] border border-transparent rounded-2xl text-sm text-slate-400 dark:text-slate-500 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition-all duration-200 cursor-pointer appearance-none">
            <option>Loading Master...</option>
          </select>
          <!-- ★ text-[10px] ➔ text-xs に底上げ -->
          <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 text-xs">▼</div>
        </div>
      </div>
 
      <div id="result-box" class="mt-6 text-left border border-slate-200/70 dark:border-slate-800/60 bg-[#f8f9fa] dark:bg-[#0f0f10]/40 rounded-2xl p-4 hidden transition-all duration-300">
        <!-- ★ text-[10px] ➔ text-xs に底上げ -->
        <div class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-3 border-b border-slate-200/60 dark:border-slate-800/60 pb-2 flex items-center gap-1.5 tracking-wider uppercase">
          📊 <span>実行レポート</span>
        </div>
        <div id="result-content" class="text-sm text-slate-700 dark:text-slate-300 space-y-2.5 font-medium"></div>
        <!-- ★ text-[11px] ➔ text-xs に底上げ -->
        <div id="heic-warning" class="mt-4 p-3.5 bg-amber-50 dark:bg-amber-950/20 border border-amber-200/60 dark:border-amber-900/30 rounded-xl text-xs text-amber-800 dark:text-amber-400 leading-relaxed hidden"></div>
      </div>
    </div>
 
    <div id="toast"
      class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-2xl text-xs font-bold tracking-wider uppercase shadow-lg opacity-0 translate-y-4 pointer-events-none transition-all duration-300 flex items-center gap-2.5 border">
    </div>
 
    <script>
      // ==========================================
      // 1. 定数とDOM参照 (Constants & DOM Elements)
      // ==========================================
      const ICONS = {
        loading: `<svg class="animate-spin h-4 w-4 text-slate-400 dark:text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`
      };

      const TOAST_THEMES = {
        success: 'border-emerald-200 dark:border-emerald-900/30 bg-emerald-50 text-emerald-800 dark:text-emerald-300',
        error: 'border-rose-200 dark:border-rose-900/30 bg-rose-50 text-rose-800 dark:text-rose-300',
        info: 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200'
      };

      const DOM = {};
      let toastTimer = null; // トーストの重複消去を防ぐためのタイマー

      // ==========================================
      // 2. 初期化 (Initialization)
      // ==========================================
      window.onload = function() {
        initDOM();
        loadModelSettings();
      };

      function initDOM() {
        DOM.btn = document.getElementById('btn');
        DOM.btnText = document.getElementById('btn-text');
        DOM.modelSelect = document.getElementById('model-select');
        DOM.resBox = document.getElementById('result-box');
        DOM.resContent = document.getElementById('result-content');
        DOM.heicWarning = document.getElementById('heic-warning');
        DOM.toast = document.getElementById('toast');
      }

      function loadModelSettings() {
        google.script.run
          .withSuccessHandler(renderModelSelect)
          .withFailureHandler((err) => showToast('❌', 'Master Sync Error: ' + err.message, 'error'))
          .getModelSettings();
      }

      // ==========================================
      // 3. UI構築・更新 (UI Updaters)
      // ==========================================
      function renderModelSelect(settings) {
        DOM.modelSelect.innerHTML = '';
        
        settings.models.forEach(model => {
          // JS標準の Option オブジェクトを使ってスッキリ生成
          const option = new Option(model, model);
          option.className = "bg-white dark:bg-[#1e1f20] text-slate-700 dark:text-slate-200";
          if (model === settings.currentModel) option.selected = true;
          DOM.modelSelect.appendChild(option);
        });
        
        DOM.modelSelect.disabled = false;
        DOM.modelSelect.classList.remove('text-slate-400', 'dark:text-slate-500');
        DOM.modelSelect.classList.add('text-slate-700', 'dark:text-slate-200');
        DOM.btn.disabled = false;
      }

      function toggleScanState(isScanning) {
        DOM.btn.disabled = isScanning;
        DOM.modelSelect.disabled = isScanning;
        
        if (isScanning) {
          DOM.resBox.classList.add('hidden');
          DOM.btnText.innerHTML = `${ICONS.loading} <span>Analyzing...</span>`;
        } else {
          DOM.btnText.innerText = 'Scan & Execute';
        }
      }

      function renderResults(result) {
        DOM.resContent.innerHTML = `
          <div class="flex justify-between"><span>✨ 新規資産登録:</span> <span class="font-bold text-slate-800 dark:text-slate-200">${result.newCount || 0} 件</span></div>
          <div class="flex justify-between"><span>📎 既存書類追加:</span> <span class="font-bold text-slate-800 dark:text-slate-200">${result.mergedCount || 0} 件</span></div>
          <div class="flex justify-between text-rose-600 dark:text-rose-400"><span>🚨 処理エラー隔離:</span> <span class="font-bold">${result.errorCount || 0} 件</span></div>
        `;
        
        if (result.heicCount > 0) {
          DOM.heicWarning.innerHTML = `
            ⚠️ <b>HEIC形式の画像が ${result.heicCount} 件スキップされました。</b><br>
            iPhoneの「設定 → カメラ → フォーマット」を「互換性優先」に変更してください。
          `;
          DOM.heicWarning.classList.remove('hidden');
        } else {
          DOM.heicWarning.classList.add('hidden');
        }
        
        DOM.resBox.classList.remove('hidden');
      }

      // ==========================================
      // 4. アクションと通信 (Actions & API)
      // ==========================================
      function runScan() {
        const selectedModel = DOM.modelSelect.value;
        
        toggleScanState(true);
        showToast('⚡', 'Gemini Scanning...', 'info');

        google.script.run
          .withSuccessHandler((result) => {
            toggleScanState(false);
            showToast('🎉', 'Scan Completed', 'success');
            renderResults(result);
          })
          .withFailureHandler((err) => {
            toggleScanState(false);
            showToast('❌', 'Error: ' + err.message, 'error');
          })
          .runScanFromUI(selectedModel);
      }

      // ==========================================
      // 5. ユーティリティ (Utilities)
      // ==========================================
      function showToast(icon, text, type) {
        const theme = TOAST_THEMES[type] || TOAST_THEMES.info;
        
        DOM.toast.className = `fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-2xl text-xs font-bold tracking-wider uppercase shadow-lg flex items-center gap-2.5 transition-all duration-300 bg-white border ${theme}`;
        DOM.toast.innerHTML = `<span>${icon}</span><span>${text}</span>`;
        
        // 表示アニメーション
        DOM.toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
        
        // 古いタイマーがあればクリア（連続タップ対策）
        if (toastTimer) clearTimeout(toastTimer);
        
        // 4.5秒後に消す
        toastTimer = setTimeout(() => {
          DOM.toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
        }, 4500);
      }
    </script>
  </body>
</html>
